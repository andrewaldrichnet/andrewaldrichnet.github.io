<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ask Andrew | AI Chatbot</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-Zenh87qX5JnK2Jl0vWa8Ck2rdkQ2Bzep5IDxbcnCeuOxjzrPF/et3URy9Bv1WTRi" crossorigin="anonymous" />
  <link href="site.css" rel="stylesheet" />
  <style>
    .chat-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    .chat-header {
      background: rgba(0, 0, 0, 0.3);
      color: white;
      padding: 20px;
      text-align: center;
      border-bottom: 2px solid rgba(255, 255, 255, 0.2);
    }

    .chat-header h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 600;
    }

    .chat-header p {
      margin: 5px 0 0 0;
      font-size: 14px;
      opacity: 0.9;
    }

    .messages-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .message {
      display: flex;
      margin-bottom: 10px;
      animation: slideIn 0.3s ease-in-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message.user {
      justify-content: flex-end;
    }

    .message.bot {
      justify-content: flex-start;
    }

    .message-content {
      max-width: 70%;
      padding: 12px 15px;
      border-radius: 12px;
      word-wrap: break-word;
      line-height: 1.4;
      font-size: 14px;
    }

    .user .message-content {
      background-color: #0d6efd;
      color: white;
      border-bottom-right-radius: 4px;
    }

    .bot .message-content {
      background-color: white;
      color: #333;
      border-bottom-left-radius: 4px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }

    .typing-indicator {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 12px 15px;
      background-color: white;
      border-radius: 12px;
      border-bottom-left-radius: 4px;
    }

    .typing-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #667eea;
      animation: typing 1.4s infinite;
    }

    .typing-dot:nth-child(2) {
      animation-delay: 0.2s;
    }

    .typing-dot:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes typing {
      0%, 60%, 100% {
        opacity: 0.5;
        transform: translateY(0);
      }
      30% {
        opacity: 1;
        transform: translateY(-10px);
      }
    }

    .input-container {
      padding: 20px;
      background: rgba(0, 0, 0, 0.2);
      border-top: 1px solid rgba(255, 255, 255, 0.2);
    }

    .input-group {
      display: flex;
      gap: 10px;
    }

    .input-group input {
      flex: 1;
      padding: 12px 15px;
      border: none;
      border-radius: 25px;
      background: white;
      font-size: 14px;
    }

    .input-group input:focus {
      outline: none;
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.3);
    }

    .input-group button {
      padding: 12px 20px;
      background: white;
      color: #667eea;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .input-group button:hover {
      background: #f0f0f0;
      transform: scale(1.05);
    }

    .input-group button:active {
      transform: scale(0.95);
    }

    .nav-back {
      position: absolute;
      top: 20px;
      left: 20px;
      background: white;
      color: #667eea;
      border: none;
      padding: 8px 15px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
      text-decoration: none;
      font-size: 14px;
      transition: all 0.3s ease;
    }

    .nav-back:hover {
      background: #f0f0f0;
      transform: translateX(-5px);
    }

    .loading-spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .error-message {
      background: #ff6b6b;
      color: white;
      padding: 12px 15px;
      border-radius: 12px;
      margin: 10px 0;
    }

    .info-message {
      background: #667eea;
      color: white;
      padding: 12px 15px;
      border-radius: 12px;
      margin: 10px 0;
    }

    .joke-message {
      background: #764ba2;
      color: white;
      padding: 12px 15px;
      border-radius: 12px;
      margin: 10px 0;
      font-style: italic;
    }

    .loading-message {
      background: rgba(255, 255, 255, 0.2);
      color: white;
      padding: 12px 15px;
      border-radius: 12px;
      margin: 10px 0;
    }

    @media (max-width: 768px) {
      .message-content {
        max-width: 85%;
      }

      .nav-back {
        top: 10px;
        left: 10px;
        padding: 6px 12px;
        font-size: 12px;
      }

      .chat-header h1 {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>
  <div class="chat-container">
    <a href="index.html" class="nav-back">← Back</a>
    
    <div class="chat-header">
      <h1>Ask Andrew</h1>
      <p>Ask me anything about my projects, skills, experience, or interests</p>
    </div>

    <div class="messages-container" id="messagesContainer">
      <!-- Initial welcome message -->
      <div class="message bot">
        <div class="message-content">
          <strong>Hi there! 👋</strong><br>Welcome to Ask Andrew! I'm loading up the AI model to chat with you...
        </div>
      </div>
    </div>

    <div class="input-container">
      <div class="input-group">
        <input 
          type="text" 
          id="userInput" 
          placeholder="Type your question here..." 
          autocomplete="off"
        />
        <button id="sendBtn">Send</button>
      </div>
      <div id="loadingStatus" style="color: white; font-size: 12px; margin-top: 8px; display: none;">
        <span class="loading-spinner"></span><span id="statusText">Loading AI model...</span>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/js/bootstrap.min.js"></script>
  
  <!-- WebLLM for local LLM -->
  <script type="module">
    import * as webllm from "https://esm.run/@mlc-ai/web-llm";

    let andrewData = null;
    let engine = null;
    let modelReady = false;
    let browserSupported = true;
    const selectedModel = "Llama-3.2-1B-Instruct-q4f32_1-MLC"; // "Llama-3.1-8B-Instruct-q4f32_1-MLC";

    const messagesContainer = document.getElementById('messagesContainer');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const loadingStatus = document.getElementById('loadingStatus');
    const statusText = document.getElementById('statusText');

    // Jokes and fun facts to show while loading
    const jokesTips = [
      "💡 Did you know? Andrew can play drums, piano, AND guitar!",
      "😄 Why did the developer go broke? Because they used up all their cache!",
      "🎵 Andrew is the music director at Johnston City UPC. Rock on! 🤘",
      "😄 How many developers does it take to change a light bulb? None, that's a hardware problem!",
      "🚀 Andrew is a Lead Engineer at Cordance, creating solutions to real-world business problems.",
      "😄 Why do Java developers wear glasses? Because they don't C#!",
      "📱 Andrew has built full-stack applications using React, Angular, TypeScript, and more!",
      "😄 A SQL query walks into a bar, walks up to two tables and asks... 'Can I join you?'",
      "🎬 Andrew has experience with video creation and photography!",
      "😄 Why did the developer go to the beach? Because they wanted to surf the web!",
      "🏆 Andrew holds multiple professional certifications in cloud and web technologies.",
      "😄 How do you comfort a JavaScript bug? You console it!",
      "🎓 Andrew holds degrees from Western Governors University and John A Logan College.",
    ];

    // Browser compatibility detection
    function checkBrowserSupport() {
      console.log('=== Checking Browser Support ===');
      
      // Check for required APIs
      const hasWebGPU = !!(navigator.gpu);
      const hasWebWorkers = typeof Worker !== 'undefined';
      const hasIndexedDB = !!window.indexedDB;
      const hasLocalStorage = !!window.localStorage;
      const isChrome = /Chrome/.test(navigator.userAgent) && /Google Inc/.test(navigator.vendor);
      const isEdge = /Edg/.test(navigator.userAgent);
      const isFirefox = /Firefox/.test(navigator.userAgent);
      const isSafari = /Safari/.test(navigator.userAgent) && !/Chrome/.test(navigator.userAgent);
      
      console.log('Browser capabilities:', {
        hasWebGPU,
        hasWebWorkers,
        hasIndexedDB,
        hasLocalStorage,
        isChrome,
        isEdge,
        isFirefox,
        isSafari,
        userAgent: navigator.userAgent
      });

      // WebLLM requires WebGPU and WebWorkers
      if (!hasWebGPU) {
        console.warn('⚠️ WebGPU not supported');
        return false;
      }

      if (!hasWebWorkers) {
        console.warn('⚠️ Web Workers not supported');
        return false;
      }

      if (!hasIndexedDB) {
        console.warn('⚠️ IndexedDB not supported');
        return false;
      }

      // Support Chrome, Edge, Firefox, and Safari
      if (!isChrome && !isEdge && !isFirefox && !isSafari) {
        console.warn('⚠️ Browser may not be fully supported');
        return false;
      }

      console.log('✓ Browser appears to support WebLLM');
      return true;
    }

    // Show browser not supported message
    function showBrowserNotSupportedMessage() {
      const messageDiv = document.createElement('div');
      messageDiv.className = 'message bot';
      
      const contentDiv = document.createElement('div');
      contentDiv.className = 'message-content error-message';
      contentDiv.innerHTML = `
        <strong>⚠️ Browser Not Fully Supported</strong><br>
        This AI chat feature requires a modern browser with WebGPU support.<br><br>
        <strong>Supported browsers and platforms:</strong>
        <ul style="margin: 10px 0; padding-left: 20px;">
          <li><strong>Chrome/Edge/Chromium 113+:</strong> Windows (Direct3D 12), macOS, ChromeOS, Android 12+ (Qualcomm/ARM GPUs), with GPU support enabled</li>
          <li><strong>Firefox 141+:</strong> Windows; Firefox 145+ on macOS Tahoe 26 (ARM64)</li>
          <li><strong>Safari:</strong> macOS Tahoe 26, iOS 26, iPadOS 26, visionOS 26</li>
        </ul>
        <strong>To enable WebGPU in Firefox (if feature flag not enabled):</strong> Visit <code>about:config</code> and set <code>dom.webgpu.enabled</code> to <code>true</code><br><br>
        I can still help using knowledge-based responses, but the full AI experience requires WebGPU.
      `;
      
      messageDiv.appendChild(contentDiv);
      messagesContainer.appendChild(messageDiv);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    // Show joke/tip while loading
    function showJokeTip() {
      const randomJoke = jokesTips[Math.floor(Math.random() * jokesTips.length)];
      const messageDiv = document.createElement('div');
      messageDiv.className = 'message bot';
      
      const contentDiv = document.createElement('div');
      contentDiv.className = 'message-content joke-message';
      contentDiv.innerHTML = randomJoke;
      
      messageDiv.appendChild(contentDiv);
      messagesContainer.appendChild(messageDiv);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    // Show informational message
    function showLoadingInfo() {
      const messageDiv = document.createElement('div');
      messageDiv.className = 'message bot';
      
      const contentDiv = document.createElement('div');
      contentDiv.className = 'message-content loading-message';
      contentDiv.innerHTML = `
        <strong>⏳ Still loading...</strong><br>
        The AI model is being initialized for the first time (this takes about 1-2 minutes on first load).
        I can answer questions right now using knowledge-based responses while we wait!
      `;
      
      messageDiv.appendChild(contentDiv);
      messagesContainer.appendChild(messageDiv);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    // Load Andrew's data
    async function loadAndrewData() {
      console.log('Loading Andrew data from JSON...');
      try {
        const response = await fetch('/data/andrewData.json');
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        andrewData = await response.json();
        console.log('✓ Andrew data loaded successfully');
        console.log('Data keys available:', Object.keys(andrewData));
      } catch (error) {
        console.error('✗ Error loading Andrew data:', error);
        showMessage('bot', '⚠️ Error loading knowledge base. Some responses may be limited. Please refresh the page.');
      }
    }

    // Track loading start time and last message time
    let loadingStartTime = null;
    let lastMessageTime = 0;
    const MESSAGE_INTERVAL = 45 * 1000; // Show a message every 45 seconds

    // Callback for model loading progress
    const initProgressCallback = (initProgress) => {
      const progress = Math.round((initProgress.progress * 100));
      statusText.textContent = `Loading AI model... ${progress}%`;
      console.log(`Progress: ${progress}%`);

      // Initialize loading start time on first call
      if (!loadingStartTime) {
        loadingStartTime = Date.now();
        lastMessageTime = 0;
      }

      // Show jokes/tips based on elapsed time (every 45 seconds)
      const elapsedTime = Date.now() - loadingStartTime;
      const timeSinceLastMessage = elapsedTime - lastMessageTime;

      if (timeSinceLastMessage >= MESSAGE_INTERVAL) {
        if (elapsedTime < MESSAGE_INTERVAL * 2) {
          showJokeTip();
        } else if (elapsedTime < MESSAGE_INTERVAL * 3) {
          showLoadingInfo();
        } else if (elapsedTime < MESSAGE_INTERVAL * 4) {
          showJokeTip();
        } else {
          // Continue showing jokes every 45 seconds after the first 2+ minutes
          showJokeTip();
        }
        lastMessageTime = elapsedTime;
      }
    };

    // Initialize the AI model using WebLLM
    async function initializeModel() {
      try {
        console.log('=== Initializing WebLLM Model ===');
        console.log('Selected model:', selectedModel);
        
        // Check browser support first
        if (!checkBrowserSupport()) {
          console.warn('Browser does not support required APIs for WebLLM');
          browserSupported = false;
          modelReady = false;
          showBrowserNotSupportedMessage();
          loadingStatus.style.display = 'block';
          statusText.textContent = 'Using knowledge-based responses (your browser requires WebGPU support)';
          return;
        }

        loadingStatus.style.display = 'block';
        statusText.textContent = 'Loading AI model... 0%';
        
        try {
          engine = await webllm.CreateMLCEngine(
            selectedModel,
            { initProgressCallback: initProgressCallback }
          );
          
          modelReady = true;
          console.log('✓ Model initialized successfully');
          console.log('=== Model Initialization Complete ===');
          loadingStatus.style.display = 'none';
          
          // Show completion message
          const messageDiv = document.createElement('div');
          messageDiv.className = 'message bot';
          
          const contentDiv = document.createElement('div');
          contentDiv.className = 'message-content';
          contentDiv.innerHTML = `
            <strong>✓ Ready to chat!</strong><br>
            The AI model has loaded successfully. You can now ask me anything about Andrew's projects, skills, experience, or interests.<br><br>
            <strong>Example questions:</strong><br>
            • <em>"What projects have you worked on?"</em><br>
            • <em>"Tell me about your experience with React"</em><br>
            • <em>"What's your background in AI and ML?"</em><br>
            • <em>"Tell me about your music interests"</em><br><br>
            <small><strong>Disclaimer:</strong> AI responses are generated automatically and may not be entirely accurate. These responses are provided for informational purposes and may not necessarily reflect Andrew's personal views, opinions, or professional recommendations. For official inquiries or critical information, please contact Andrew directly.</small>
          `;
          
          messageDiv.appendChild(contentDiv);
          messagesContainer.appendChild(messageDiv);
          messagesContainer.scrollTop = messagesContainer.scrollHeight;

          // Reset loading timer
          loadingStartTime = null;
          lastMessageTime = 0;
        } catch (error) {
          console.error('Model loading error:', error);
          
          // Check if it's a WebGPU-related error
          if (error.message && (error.message.includes('WebGPU') || error.message.includes('GPU'))) {
            browserSupported = false;
            showBrowserNotSupportedMessage();
          } else {
            console.error('Error details:', {
              name: error.name,
              message: error.message,
              stack: error.stack
            });
            showMessage('bot', '⚠️ AI model failed to load. Using knowledge-based responses instead. Try refreshing if you continue to have issues.');
          }
          
          modelReady = false;
          loadingStatus.style.display = 'block';
          statusText.textContent = 'Using knowledge-based responses';

          // Reset loading timer
          loadingStartTime = null;
          lastMessageTime = 0;
        }
      } catch (error) {
        console.error('Unexpected error during initialization:', error);
        showMessage('bot', '⚠️ An unexpected error occurred. Please refresh the page.');
        modelReady = false;
        loadingStatus.style.display = 'block';
        statusText.textContent = 'Error during initialization';

        // Reset loading timer
        loadingStartTime = null;
        lastMessageTime = 0;
      }
    }

    // Get available data keys from andrewData
    function getAvailableKeys() {
      if (!andrewData) {
        console.warn('getAvailableKeys: andrewData not loaded');
        return [];
      }
      const keys = Object.keys(andrewData).filter(key => key !== '_id');
      console.log('Available data keys:', keys);
      return keys;
    }

    // Ask LLM which context keys would be helpful for the user's question
    async function requestContextKeys(userQuestion) {
      console.log('=== requestContextKeys START ===');
      console.log('User question:', userQuestion);
      
      if (!modelReady || !engine) {
        console.warn('Model not ready, returning all available keys');
        const allKeys = getAvailableKeys();
        console.log('Fallback keys:', allKeys);
        return allKeys;
      }

      try {
        const availableKeys = getAvailableKeys();
        console.log('Available keys for LLM selection:', availableKeys);
        
        const systemPrompt = `You are a helpful assistant that determines which data context would be useful for answering a question about Andrew Aldrich. 

Respond with ONLY the following format:
USECONTEXT key1, key2, key3

Where key1, key2, etc. are the relevant data categories from this list: ${availableKeys.join(', ')}

Choose only the keys that are necessary to answer the question well. Always include 'profile' for context about who Andrew is.`;

        const messages = [
          { role: "system", content: systemPrompt },
          { 
            role: "user", 
            content: `Question: "${userQuestion}"\n\nWhich data keys from the available data would be helpful to answer this question? Respond with the USECONTEXT format only.`
          }
        ];

        console.log('Sending context key request to LLM...');
        const chunks = await engine.chat.completions.create({
          messages,
          temperature: 0.3,
          max_tokens: 100,
          stream: true,
        });

        let response = "";
        for await (const chunk of chunks) {
          response += chunk.choices[0]?.delta.content || "";
        }

        console.log('LLM context key response:', response);

        // Parse the response to extract keys
        const match = response.match(/USECONTEXT\s*(.+)/i);
        if (match) {
          const keysString = match[1].trim();
          console.log('Extracted keys string:', keysString);
          
          const requestedKeys = keysString
            .split(',')
            .map(k => k.trim())
            .filter(k => availableKeys.includes(k));
          
          console.log('Parsed requested keys:', requestedKeys);
          console.log('=== requestContextKeys END (SUCCESS) ===');
          
          return requestedKeys.length > 0 ? requestedKeys : availableKeys;
        }
        
        console.warn('No USECONTEXT format found in response, using all keys');
        console.log('=== requestContextKeys END (FALLBACK) ===');
        return availableKeys;
      } catch (error) {
        console.error('Error requesting context keys:', error);
        console.log('=== requestContextKeys END (ERROR) ===');
        return getAvailableKeys();
      }
    }

    // Format Andrew's data into context based on selected keys
    function buildContext(selectedKeys) {
      console.log('=== buildContext START ===');
      console.log('Selected keys:', selectedKeys);
      
      if (!andrewData || !selectedKeys || selectedKeys.length === 0) {
        console.warn('buildContext: Missing andrewData or selectedKeys');
        console.log('=== buildContext END (EMPTY) ===');
        return '';
      }
      
      let context = '';
      let includedSections = [];
      
      // Always include profile information
      if (selectedKeys.includes('profile') || selectedKeys.includes('profile')) {
        context += `You are an AI assistant representing Andrew Aldrich.\n`;
        context += `Title: ${andrewData.profile.title}\n`;
        context += `About: ${andrewData.profile.description}\n`;
        context += `Location: ${andrewData.profile.location}\n`;
        context += `LinkedIn: ${andrewData.profile.linkedIn}\n\n`;
        includedSections.push('profile');
      }

      if (selectedKeys.includes('skills')) {
        context += `Skills: ${andrewData.skills.join(', ')}\n\n`;
        includedSections.push('skills');
      }

      if (selectedKeys.includes('projects') && andrewData.projects) {
        context += `Projects:\n`;
        andrewData.projects.forEach(project => {
          context += `- ${project.title}: ${project.description} (Tech: ${project.techUsed.join(', ')})\n`;
        });
        context += '\n';
        includedSections.push('projects');
      }

      if (selectedKeys.includes('education') && andrewData.education) {
        context += `Education:\n`;
        andrewData.education.forEach(edu => {
          context += `- ${edu.degree} from ${edu.school} (${edu.years})\n`;
        });
        context += '\n';
        includedSections.push('education');
      }

      if (selectedKeys.includes('certificates') && andrewData.certificates) {
        context += `Certifications:\n`;
        andrewData.certificates.forEach(cert => {
          context += `- ${cert.name} (${cert.issuer})\n`;
        });
        context += '\n';
        includedSections.push('certificates');
      }

      if (selectedKeys.includes('experience') && andrewData.experience) {
        context += `Experience:\n`;
        andrewData.experience.forEach(exp => {
          context += `- ${exp.title} at ${exp.company} (${exp.years})\n`;
        });
        context += '\n';
        includedSections.push('experience');
      }

      if (selectedKeys.includes('interests') && andrewData.interests) {
        context += `Interests: ${JSON.stringify(andrewData.interests, null, 2)}\n\n`;
        includedSections.push('interests');
      }

      console.log('Included sections:', includedSections);
      console.log('Context length (chars):', context.length);
      console.log('Context preview:', context.substring(0, 200) + '...');
      console.log('=== buildContext END ===');
      
      return context;
    }

    // Generate response using WebLLM engine with smart context retrieval
    async function generateResponse(userQuestion) {
      console.log('=== generateResponse START ===');
      console.log('User question:', userQuestion);
      console.log('Model ready:', modelReady);
      
      // If model is ready, use smart context retrieval
      if (modelReady && engine) {
        try {
          statusText.textContent = 'Analyzing question...';
          console.log('Step 1: Requesting context keys...');
          
          // Ask LLM which context keys would be helpful
          const contextKeys = await requestContextKeys(userQuestion);
          console.log('Step 2: Received context keys:', contextKeys);
          
          // Create a thinking message based on context keys
          const thinkingMessages = {
            skills: "Looking at Andrew's technical skills...",
            projects: "Reviewing Andrew's project experience...",
            experience: "Checking Andrew's work history...",
            education: "Considering Andrew's education...",
            interests: "Exploring Andrew's interests...",
            certificates: "Reviewing Andrew's certifications...",
            profile: "Gathering profile information..."
          };
          
          const thinkingText = contextKeys
            .filter(key => thinkingMessages[key])
            .map(key => thinkingMessages[key])
            .join(' ');
          
          if (thinkingText) {
            console.log('Thinking message:', thinkingText);
            showMessage('bot', `<em>${thinkingText}</em>`);
          }
          
          statusText.textContent = 'Preparing context...';
          console.log('Step 3: Building context with selected keys...');
          
          // Build context with only relevant keys
          const context = buildContext(contextKeys);
          console.log('Step 4: Context prepared, length:', context.length);
          
          statusText.textContent = 'Generating response...';
          console.log('Step 5: Generating AI response with streaming...');
          
          const systemPrompt = `You are an AI assistant representing Andrew Aldrich, a Full Stack Engineer. Answer questions about Andrew based on the context provided. Be conversational, friendly, and keep responses concise (2-3 sentences typically).`;
          
          const messages = [
            { role: "system", content: systemPrompt },
            { 
              role: "user", 
              content: `Context about Andrew:\n${context}\n\nQuestion from visitor: ${userQuestion}\n\nProvide a helpful, accurate response about Andrew based on the context provided.`
            }
          ];

          console.log('Sending to LLM with', messages.length, 'messages');
          console.log('Total prompt length:', messages.reduce((sum, m) => sum + m.content.length, 0), 'chars');

          // Use streaming for real-time response display
          const chunks = await engine.chat.completions.create({
            messages,
            temperature: 0.3,
            max_tokens: 300,
            stream: true,
            stream_options: { include_usage: true },
          });

          let fullReply = "";
          const botMessageId = 'bot-response-' + Date.now();
          let botMessageElement = null;
          
          for await (const chunk of chunks) {
            const content = chunk.choices[0]?.delta.content || "";
            fullReply += content;
            
            // Display content as it streams in
            if (content) {
              if (!botMessageElement) {
                // Create new bot message on first chunk
                const messageDiv = document.createElement('div');
                messageDiv.className = 'message bot';
                messageDiv.id = botMessageId;
                
                const contentDiv = document.createElement('div');
                contentDiv.className = 'message-content';
                contentDiv.id = botMessageId + '-content';
                
                messageDiv.appendChild(contentDiv);
                messagesContainer.appendChild(messageDiv);
                botMessageElement = contentDiv;
              }
              
              // Update content with streamed text
              botMessageElement.textContent += content;
              
              // Auto-scroll to bottom
              messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }
            
            // Log usage info from last chunk
            if (chunk.usage) {
              console.log('Step 6: Token usage:', chunk.usage);
            }
          }
          
          const finalReply = await engine.getMessage();
          console.log('Step 7: Final message from engine:', finalReply);
          console.log('Step 8: Streamed response complete, total length:', fullReply.length);
          console.log('Full response:', fullReply);
          console.log('=== generateResponse END (SUCCESS) ===');
          
          return fullReply.trim() || getKnowledgeBasedResponse(userQuestion);
        } catch (error) {
          console.error('Error in generateResponse:', error);
          console.error('Error details:', {
            name: error.name,
            message: error.message,
            stack: error.stack
          });
          console.log('=== generateResponse END (ERROR) - Falling back to knowledge base ===');
          return getKnowledgeBasedResponse(userQuestion);
        }
      }
      
      console.log('Model not ready, using knowledge-based responses');
      console.log('=== generateResponse END (FALLBACK) ===');
      // Fallback to knowledge-based responses
      return getKnowledgeBasedResponse(userQuestion);
    }

    // Knowledge-based response system (works without AI model)
    function getKnowledgeBasedResponse(userQuestion) {
      const question = userQuestion.toLowerCase();
      
      // Project queries
      if (question.includes('project')) {
        const projectNames = andrewData.projects.map(p => p.title).join(', ');
        return `Andrew has worked on several projects: ${projectNames}. Which one would you like to know more about?`;
      }

      if (question.includes('ai') || question.includes('machine learning')) {
        const aiProjects = andrewData.projects.filter(p => 
          p.techUsed.includes('AI') || p.techUsed.includes('Machine Learning')
        );
        return `Andrew has experience with AI and ML through projects like: ${aiProjects.map(p => p.title).join(', ')}. He's particularly interested in using AI to solve real-world business problems.`;
      }

      if (question.includes('react') || question.includes('angular')) {
        return `Andrew has expertise in both React and Angular. He's used React in projects like LiveBulletin and Angular in the Team Reporting Tool and Musicians Worship. He's proficient in TypeScript for both frameworks.`;
      }

      if (question.includes('music')) {
        return `Andrew is passionate about music! He plays drums, piano, and guitar (his favorite). He serves as the music director at Johnston City United Pentecostal Church and has played at youth camps and conventions. He even has a project called "Musicians Worship" to help church musicians manage chord charts and resources.`;
      }

      if (question.includes('education') || question.includes('degree')) {
        return `Andrew earned a Bachelor of Science in Computer Science from Western Governors University (2019-2020) and an Associate of Science in Computer Science from John A Logan College (2016-2019).`;
      }

      if (question.includes('skill') || question.includes('technology')) {
        return `Andrew's technical skills include: ${andrewData.skills.slice(0, 10).join(', ')}, and many more. He's a full-stack developer with expertise in both backend and frontend technologies.`;
      }

      if (question.includes('experience') || question.includes('work')) {
        return `Andrew is currently a Lead Engineer at Cordance (since Sep 2020, with prior internship from July 2016 - May 2019). He creates innovative solutions to solve business problems and make operations more efficient.`;
      }

      if (question.includes('certificate') || question.includes('certified')) {
        const certs = andrewData.certificates.map(c => c.name).join(', ');
        return `Andrew holds several certifications: ${certs}. These demonstrate his commitment to professional development and industry standards.`;
      }

      if (question.includes('interest') || question.includes('hobby')) {
        return `Andrew is interested in music (plays multiple instruments), photography (capturing moments in time), and video creation (editing music videos). He's also involved in worship ministry and community service.`;
      }

      // Default response
      return `That's a great question! I'm still learning about Andrew. Feel free to ask about his projects, skills, experience, education, or interests. You could also ask about specific technologies or projects he's worked on.`;
    }

    // Display message in chat
    function showMessage(sender, text, messageType = 'default') {
      const messageDiv = document.createElement('div');
      messageDiv.className = `message ${sender}`;
      
      const contentDiv = document.createElement('div');
      contentDiv.className = 'message-content';
      
      // Add message type classes for styling
      if (messageType === 'error') {
        contentDiv.classList.add('error-message');
      } else if (messageType === 'info') {
        contentDiv.classList.add('info-message');
      }
      
      contentDiv.innerHTML = text; // Support for HTML formatting
      
      messageDiv.appendChild(contentDiv);
      messagesContainer.appendChild(messageDiv);
      
      // Scroll to bottom
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    // Show typing indicator
    function showTypingIndicator() {
      const messageDiv = document.createElement('div');
      messageDiv.className = 'message bot';
      messageDiv.id = 'typingIndicator';
      
      const contentDiv = document.createElement('div');
      contentDiv.className = 'typing-indicator';
      contentDiv.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
      
      messageDiv.appendChild(contentDiv);
      messagesContainer.appendChild(messageDiv);
      
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    // Remove typing indicator
    function removeTypingIndicator() {
      const indicator = document.getElementById('typingIndicator');
      if (indicator) indicator.remove();
    }

    // Handle send button click
    async function handleSendMessage() {
      const message = userInput.value.trim();
      
      console.log('=== handleSendMessage START ===');
      console.log('User message:', message);
      console.log('Model ready:', modelReady);
      
      if (!message) {
        console.log('Message is empty, ignoring');
        return;
      }
      
      // Show user message
      showMessage('user', message);
      userInput.value = '';
      sendBtn.disabled = true;
      
      // Show typing indicator
      showTypingIndicator();
      loadingStatus.style.display = 'block';
      loadingStatus.style.color = 'white';
      
      console.log('UI updated: message displayed, input cleared, loading shown');
      
      try {
        // Generate response
        console.log('Calling generateResponse...');
        await generateResponse(message);
        
        console.log('Response generation complete');
        removeTypingIndicator();
        loadingStatus.style.display = 'none';
        console.log('=== handleSendMessage END (SUCCESS) ===');
      } catch (error) {
        console.error('Error in handleSendMessage:', error);
        console.error('Error details:', {
          name: error.name,
          message: error.message,
          stack: error.stack
        });
        removeTypingIndicator();
        loadingStatus.style.display = 'none';
        
        // Show user-friendly error message
        let errorMessage = '❌ Sorry, I encountered an error processing your question.';
        
        if (error.message && error.message.includes('GPU')) {
          errorMessage = '⚠️ GPU error detected. Please try refreshing the page or using a different browser.';
        } else if (error.message && error.message.includes('memory')) {
          errorMessage = '⚠️ Out of memory. Please refresh the page and try again.';
        } else if (error.message && error.message.includes('timeout')) {
          errorMessage = '⏱️ Request timed out. Please try asking a simpler question or refresh the page.';
        }
        
        showMessage('bot', errorMessage, 'error');
        console.log('=== handleSendMessage END (ERROR) ===');
      } finally {
        sendBtn.disabled = false;
        userInput.focus();
      }
    }

    // Event listeners
    sendBtn.addEventListener('click', handleSendMessage);
    userInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter' && !e.shiftKey && !sendBtn.disabled) {
        e.preventDefault();
        handleSendMessage();
      }
    });

    // Initialize on page load
    window.addEventListener('load', async () => {
      console.log('=== PAGE LOAD START ===');
      console.log('Page loaded, initializing application...');
      
      await loadAndrewData();
      await initializeModel();
      
      userInput.focus();
      console.log('Application initialization complete');
      console.log('=== PAGE LOAD COMPLETE ===');
    });
  </script>
</body>
